# ✿ FRACTAL ✿  Omarchy shell surfaces
# Indigo night glass, candle-white text, saffron for what is chosen and a
# saffron -> lotus -> violet -> teal gradient wherever a card has a border.

[bar]
background       = "#100e22"
background-alpha = 0.82
text             = "#e9dfcc"
active           = "#e7a1c4"
scale-with-font  = true
size-horizontal  = 26
size-vertical    = 28

[hyprland]
active-border            = "#e6b35a #e7a1c4 #a58ae6 #72c6c4 45deg"
active-border-foreground = "#e6b35a #a58ae6 #72c6c4 135deg"

[controls]
normal-color        = "#e9dfcc"
normal-fill-alpha   = 0.03
normal-border       = "#a58ae6"
normal-border-width = 1
normal-border-alpha = 0.30

hover-cursor-color        = "#faf3e6"
hover-cursor-fill-alpha   = 0.10
hover-cursor-border       = "#e7a1c4"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.55

focus-color        = "#faf3e6"
focus-fill-alpha   = 0.10
focus-border       = "#e6b35a"
focus-border-width = 1
focus-border-alpha = 0.80

selected-color        = "#15122b"
selected-fill-alpha   = 0.85
selected-border       = "#e6b35a"
selected-border-width = 0
selected-border-alpha = 1.0

pressed-fill-alpha   = 0.26
selection-fill-alpha = 0.40

[spacing]
scale = 1.0
scale-with-font = true

[font]
base-size = 12

[popups]
background       = "#141129"
background-alpha = 0.97
text             = "#e9dfcc"
border           = "hyprland.active-border"
border-alpha     = 0.9

[tooltip]
background       = "#100e22"
background-alpha = 0.95
text             = "#f1e8d8"
border           = "#e6b35a #a58ae6 135deg"
border-alpha     = 0.8

[notifications]
background       = "#141129"
background-alpha = 0.94
text             = "#e9dfcc"
border           = "hyprland.active-border"
border-alpha     = 0.9
countdown        = "#e6b35a"

[launcher]
background                = "#120f26"
background-alpha          = 0.97
text                      = "#e9dfcc"
border                    = "hyprland.active-border"
border-alpha              = 0.9
scrim                     = "#0b0a19"
scrim-alpha               = 0.50
selected-background       = "#e6b35a"
selected-background-alpha = 0.14
selected-text             = "#f2d58f"
selected-border           = "#e6b35a"
selected-border-alpha     = 0.50

[menu]
background                = "#120f26"
background-alpha          = 0.97
text                      = "#e9dfcc"
border                    = "hyprland.active-border"
border-alpha              = 0.9
scrim                     = "#0b0a19"
scrim-alpha               = 0.50
selected-background       = "#e6b35a"
selected-background-alpha = 0.14
selected-text             = "#f2d58f"
selected-border           = "#e6b35a"
selected-border-alpha     = 0.50

[polkit]
background       = "#120f26"
background-alpha = 0.96
text             = "#e9dfcc"
text-error       = "#f0a3b2"
border           = "hyprland.active-border"
border-error     = "#e48a9a"
border-alpha     = 1.0
scrim            = "#0b0a19"
scrim-alpha      = 0.65
accent           = "#e6b35a"

[lock]
background       = "#100e22"
background-alpha = 0.80
text             = "#f1e8d8"
placeholder      = "#8a82ad"
text-error       = "#f0a3b2"
border           = "#3a3163"
border-active    = "hyprland.active-border"
border-error     = "#e48a9a"
border-alpha     = 1.0
selection        = "#e6b35a"
selection-alpha  = 0.40

[image-picker]
scrim                   = "#0b0a19"
scrim-alpha             = 0.65
text                    = "#e9dfcc"
selected-border         = "#e6b35a"
selected-border-alpha   = 1.0
unselected-border       = "#a58ae6"
unselected-border-alpha = 0.30
